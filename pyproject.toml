[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "secondchance"
version = "1.0.0"
description = "SecondChance: an error checkpoint dataset and evaluation harness for error recovery in AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
# tau2-bench is not on PyPI (the PyPI name "tau2" belongs to an unrelated package): `secondchance setup tau2` installs it from the
# pinned commit together with its data. These pins are the library versions of the evaluation (tool error messages carry pydantic's version).
tau2 = ["pydantic==2.13.5", "litellm==1.82.6"]
bfcl = ["bfcl-eval==2026.3.23", "mpmath==1.3.0", "litellm==1.82.6"]
review = ["openai>=1.40"]  # the client for the pinned judge of the semantic review (any OpenAI-compatible endpoint)
hf = ["datasets>=3.6,<4", "pyarrow>=15,<19"]  # pyarrow 19+ needs NumPy 2; tau2-bench pins NumPy 1.26
dev = ["pytest>=8"]

[project.scripts]
secondchance = "secondchance.cli:main"

[project.urls]
Dataset = "https://huggingface.co/datasets/SecondChance/SecondChance"

[tool.setuptools.packages.find]
include = ["secondchance*"]

[tool.setuptools.package-data]
secondchance = ["review/rubrics/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
